<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpDesk Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- LADO ESQUERDO -->
        <div class="left">
            <h2>💬 HelpDesk</h2>

            <h1>
                Sistema de <br>
                Gerenciamento <br>
                <span>de Chamados</span>
            </h1>

            <p>
                Organize, acompanhe e resolva chamados de forma rápida e eficiente.
            </p>

            <small>✔ Seguro, confiável e eficiente</small>
        </div>

        <!-- LADO DIREITO -->
        <div class="right">
            <div class="card">

                <div class="icon">💬</div>

                <h2>Bem-vindo!</h2>
                <p>Faça login para acessar sua conta</p>

                <form>

                    <label>E-mail</label>
                    <div class="input-group">
                        <span class="icon-left">📧</span>
                        <input type="email" placeholder="seu@email.com">
                    </div>

                    <label>Senha</label>
                    <div class="input-group">
                        <span class="icon-left">🔒</span>
                        <input type="password" id="senha" placeholder="Digite sua senha">
                        <span class="icon-right" onclick="toggleSenha()">👁️</span>
                    </div>

                    <div class="options">
                        <label class="lembrar">
                            <input type="checkbox" checked>
                            Lembrar de mim
                        </label>
                        <a href="#">Esqueci minha senha</a>
                    </div>

                    <button type="submit">Entrar</button>

                    <div class="divider">ou</div>

                    <button class="google">Entrar com Google</button>

                    <p class="register">
                        Não tem uma conta? <a href="#">Solicite acesso</a>
                    </p>

                </form>
            </div>
        </div>

    </div>
    <script>
        function toggleSenha() {
            const input = document.getElementById("senha");
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
</body>

</html>
